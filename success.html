<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment Successful - T0-BIM</title>
    <link rel="icon" type="image/jpeg" href="TOBIM.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #00d2d3 !important;
            --secondary-blue: #0984e3 !important;
            --dark-bg: #0b0f19 !important;
            --dark-card: #131722 !important;
            --border-blue: rgba(0, 210, 211, 0.4) !important;
            --text-main: #ffffff !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-bg) !important;
            color: var(--text-main) !important;
            direction: ltr;
            text-align: left;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }

        .header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background: rgba(11, 15, 25, 0.95) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-blue) !important;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff !important;
            text-decoration: none;
            font-weight: 900;
            font-size: 20px;
        }

        .logo img {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary-blue) !important;
        }

        .logo span {
            color: var(--primary-blue) !important;
        }

        .navbar {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .navbar a {
            color: #dcdde1 !important;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: 0.3s;
        }

        .navbar a:hover, .navbar a.active {
            color: var(--primary-blue) !important;
        }

        .success-container {
            max-width: 650px;
            margin: 160px auto 80px auto;
            padding: 0 5%;
            width: 100%;
        }

        .success-box {
            background: var(--dark-card) !important;
            border: 2px solid var(--primary-blue) !important;
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 210, 211, 0.15);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(0, 210, 211, 0.15);
            border: 2px solid var(--primary-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: var(--primary-blue);
            margin: 0 auto 25px auto;
        }

        .success-box h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 15px;
            color: #fff !important;
        }

        .success-box p {
            font-size: 15px;
            line-height: 1.8;
            opacity: 0.85;
            color: #dcdde1 !important;
            margin-bottom: 30px;
        }

        .btn-home {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue)) !important;
            color: #0b0f19 !important;
            padding: 15px 40px;
            border-radius: 40px;
            font-weight: 900;
            font-size: 16px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 210, 211, 0.4);
            transition: 0.3s;
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 210, 211, 0.6);
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid var(--border-blue) !important;
            opacity: 0.7;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <img src="TOBIM.jpg" alt="T0-BIM Logo"> T0-BIM <span>Academy</span>
        </a>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="courses.html">Courses</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <div class="success-container">
        <div class="success-box">
            <div class="success-icon">
                <i class="fa-solid fa-check"></i>
            </div>
            <h1>Enrollment Successful!</h1>
            <p>Thank you for enrolling in T0-BIM Academy. Your payment request has been received successfully, and our team will review and activate your portal credentials shortly.</p>
            <a href="index.html" class="btn-home">Return to Home Page</a>
        </div>
    </div>

    <footer>
        @2026 T0-BIM. All rights reserved.
    </footer>
</body>
</html>
